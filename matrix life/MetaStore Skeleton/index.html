<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b0d12" />
  <title>MetaStore · 第一人称仓库展厅</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <!-- ========== 3D 渲染挂载点 ========== -->
  <div id="app" class="app-root">
    <canvas id="webgl-canvas"></canvas>
  </div>

  <!-- ========== 开始界面 ========== -->
  <div id="start-overlay" class="start-overlay visible">
    <div class="start-card">
      <div class="start-title">MetaStore · 仓库展厅</div>
      <div class="start-sub">第一人称漫游 · 点击商品查看详情 · ESC 打开菜单</div>
      <button id="btn-start" class="hud-btn start-btn" type="button">▶ 点击进入</button>
      <div class="start-hint">WASD / 方向键移动 · 鼠标转向 · Shift 奔跑</div>
    </div>
  </div>

  <!-- ========== 退出结束页 ========== -->
  <div id="exit-screen" class="exit-screen">
    <div class="start-card">
      <div class="start-title">感谢光临 👋</div>
      <div class="start-sub">您已离开商店。欢迎再次光临 MetaStore。</div>
      <button id="btn-reenter" class="hud-btn start-btn" type="button">↩ 重新进入</button>
    </div>
  </div>

  <!-- ========== 全局加载遮罩 ========== -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-card">
      <div class="loading-title">MetaStore · 展厅资源加载中</div>
      <div class="loading-track">
        <div id="loading-bar" class="loading-bar"></div>
      </div>
      <div id="loading-text" class="loading-text">0%</div>
    </div>
  </div>

  <!-- ========== HUD ========== -->
  <div id="hud" class="hud">
    <div class="hud-top-left">
      <div id="scene-name" class="scene-name">—</div>
      <div id="scene-hint" class="scene-hint"></div>
    </div>
    <div class="hud-top-right">
      <button id="btn-toggle-mode" class="hud-btn" type="button">控制：自动</button>
      <button id="btn-request-gyro" class="hud-btn hud-btn-warn" type="button" hidden>启用陀螺仪</button>
      <button id="btn-mobile-menu" class="hud-btn hud-btn-mobile" type="button" hidden>☰ 菜单</button>
    </div>
    <div id="crosshair" class="crosshair" aria-hidden="true">
      <div class="crosshair-ring"></div>
      <div class="crosshair-dot"></div>
    </div>
    <div id="stats-container" class="stats-container"></div>
  </div>

  <!-- ========== ESC 菜单 ========== -->
  <div id="escape-menu" class="escape-menu">
    <div class="escape-card">
      <div class="escape-title">游戏菜单</div>
      <button id="menu-resume" class="hud-btn menu-btn" type="button">▶ 继续游戏</button>
      <button id="menu-sound" class="hud-btn menu-btn" type="button"><span id="menu-sound-label">音效：开</span></button>
      <button id="menu-admin" class="hud-btn menu-btn" type="button">🛠 管理员模式</button>
      <button id="menu-exit" class="hud-btn menu-btn menu-btn-danger" type="button">🚪 退出商店</button>

      <!-- 管理员密码验证 -->
      <div id="admin-password-panel" class="pwd-panel" hidden>
        <div class="pwd-title">管理员验证</div>
        <textarea id="admin-password-input" class="pwd-input" rows="4"
                  placeholder="输入管理员密码（300 位，见工作空间 admin-password.txt，支持粘贴）"></textarea>
        <div class="pwd-actions">
          <button id="admin-password-paste" class="hud-btn menu-btn menu-btn-sm" type="button">📋 粘贴</button>
          <button id="admin-password-submit" class="hud-btn menu-btn menu-btn-sm menu-btn-primary" type="button">验证</button>
          <button id="admin-password-cancel" class="hud-btn menu-btn menu-btn-sm" type="button">取消</button>
        </div>
        <div id="admin-password-msg" class="pwd-msg"></div>
      </div>
    </div>
  </div>

  <!-- ========== 管理员模式面板 ========== -->
  <div id="admin-panel" class="admin-panel">
    <div class="admin-card">
      <div class="admin-header">
        <span class="admin-title">🛠 管理员模式 · 展陈布置</span>
        <button id="admin-close" class="chat-close" type="button" aria-label="关闭">✕</button>
      </div>

      <div class="admin-row">
        <label class="admin-label" for="admin-type-filter">对象类型</label>
        <select id="admin-type-filter" class="admin-select"></select>
      </div>
      <div class="admin-row">
        <label class="admin-label" for="admin-obj-list">对象</label>
        <select id="admin-obj-list" class="admin-select"></select>
      </div>

      <div id="admin-selected-info" class="admin-info">未选中对象</div>

      <div class="admin-row admin-meta">
        <input id="admin-name-input" class="admin-input" type="text" placeholder="商品名称" disabled />
        <input id="admin-price-input" class="admin-input admin-input-sm" type="text" placeholder="价格" disabled />
      </div>
      <div class="admin-row">
        <textarea id="admin-desc-input" class="admin-input admin-desc" rows="2" placeholder="讲解词（TTS 朗读）" disabled></textarea>
      </div>

      <div class="admin-hint">
        ↑↓←→ / WASD 移动 · Q/E 旋转 · R/F 升降 · Shift 大步 · X 保存 · Esc 退出
      </div>
      <div id="admin-hint" class="admin-hint admin-hint-msg"></div>

      <div class="admin-actions">
        <button id="admin-save" class="hud-btn menu-btn menu-btn-sm menu-btn-primary" type="button">💾 保存布局</button>
        <button id="admin-reset" class="hud-btn menu-btn menu-btn-sm" type="button">↺ 恢复默认</button>
      </div>
    </div>
  </div>

  <!-- ========== 展区讲解面板（三选一） ========== -->
  <div id="guide-panel" class="guide-panel">
    <div class="guide-card">
      <div class="guide-header">
        <span id="guide-title" class="guide-title">🗺 展区讲解</span>
        <button id="guide-close" class="chat-close" type="button" aria-label="关闭">✕</button>
      </div>
      <div id="guide-body" class="guide-body"></div>
      <div class="guide-footer">
        <button id="guide-shuffle" class="hud-btn menu-btn menu-btn-sm" type="button">🔄 换一批</button>
      </div>
    </div>
  </div>

  <!-- ========== 屏幕空间聊天窗口 ========== -->
  <div id="chat-root" class="chat-root" hidden>
    <div class="chat-window">
      <div class="chat-header">
        <span id="chat-title" class="chat-title">AI 导购</span>
        <button id="chat-close" class="chat-close" type="button" aria-label="关闭">✕</button>
      </div>
      <div id="chat-body" class="chat-body"></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" class="chat-input" type="text"
               placeholder="向 AI 导购提问，例如：介绍该商品的制作工艺…" autocomplete="off" />
        <button id="chat-send" class="chat-send" type="submit">发送</button>
      </form>
    </div>
  </div>

  <!-- 模块入口 -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
